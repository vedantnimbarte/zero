name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # ponytail: fmt and clippy are advisory until the backlog is cleared
      # (whole-repo rustfmt diff + ~19 clippy errors). Drop continue-on-error
      # once a cleanup PR lands, then they gate too.
      - run: cargo fmt --all --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next generates PageProps/LayoutProps into .next/types; without this
      # tsc only passes on a machine that has already run the dev server.
      - run: npx next typegen
      - run: npx tsc --noEmit
